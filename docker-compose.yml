services:
  db:
    image: postgres:16-alpine
    container_name: pocket48-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pocket48}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pocket48}
      POSTGRES_DB: ${POSTGRES_DB:-pocket48}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pocket48} -d ${POSTGRES_DB:-pocket48}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pocket48-migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: ./server/.env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-pocket48}:${POSTGRES_PASSWORD:-pocket48}@db:5432/${POSTGRES_DB:-pocket48}?schema=public
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminInitial123!}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-DemoInitial123!}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-true}
    command: ["sh", "-c", "npx prisma migrate deploy && npm run prisma:seed"]

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: pocket48-server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    env_file:
      - path: ./server/.env
        required: false
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      TZ: ${TZ:-Asia/Bangkok}
      PORT: ${PORT:-3000}
      DATABASE_URL: postgresql://${POSTGRES_USER:-pocket48}:${POSTGRES_PASSWORD:-pocket48}@db:5432/${POSTGRES_DB:-pocket48}?schema=public
      SESSION_SECRET: ${SESSION_SECRET:-dev-pocket48-session-secret-at-least-32-chars}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ""
    container_name: pocket48-client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  postgres_data:
