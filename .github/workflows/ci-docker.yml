# ##############################################################################
# pocKet48 CI — "CI & Docker Build"
# ##############################################################################
# WHAT THIS WORKFLOW DOES
#   Runs the project's automated checks and is used in two ways:
#     1) directly on every pull request to `staging` and `main` (and manually),
#     2) as a REUSABLE workflow called by deploy.yml (`workflow_call`) so
#        deployment only starts after all checks pass.
#   Steps: offline deploy-script checks -> backend migrate/seed/test/build
#          (PostgreSQL 16 service) -> frontend test/build -> Playwright E2E
#          journey (TEST-13) -> unified production Dockerfile build.
#   It does NOT deploy anything.
#
# ⚠️ DO NOT RENAME (the lab guide and ruleset refer to these names):
#   - job id : test-and-docker
#   - deploy.yml uses `environment: demo` and the 4 variables GCP_PROJECT_ID,
#     GCP_REGION, WIF_PROVIDER, WIF_SERVICE_ACCOUNT — keep those names too.
#
# REFERENCES
#   - Workflow syntax      : https://docs.github.com/en/actions/writing-workflows/workflow-syntax-for-github-actions
#   - Reusable workflows   : https://docs.github.com/en/actions/sharing-automations/reusing-workflows
#   - Service containers   : https://docs.github.com/en/actions/using-containerized-services/about-service-containers
#   - Concurrency          : https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/control-the-concurrency-of-workflows-and-jobs
#   - Pin actions to a SHA : https://docs.github.com/en/actions/security-for-github-actions/security-guides/security-hardening-for-github-actions#using-third-party-actions
# ##############################################################################

name: CI & Docker Build

# ------------------------------------------------------------------------------
# Triggers
#   workflow_call             : lets deploy.yml reuse this workflow.
#   pull_request/main,staging : checks every PR before merge.
#   workflow_dispatch         : manual "Run workflow" button.
# ------------------------------------------------------------------------------
on:
  workflow_call:
  pull_request:
    branches: [main, staging]
  workflow_dispatch:

# Least privilege: this workflow only needs to read the repository.
permissions:
  contents: read

# A newer run on the same ref cancels the older one (saves minutes).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ⚠️ Job id must stay `test-and-docker`.
  test-and-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # --------------------------------------------------------------------------
    # Temporary PostgreSQL 16 used only by CI tests. Throw-away CI values, not
    # real secrets. Matches DATABASE_URL below.
    # --------------------------------------------------------------------------
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pocket48
          POSTGRES_PASSWORD: pocket48
          POSTGRES_DB: pocket48
        ports:
          - 5432:5432
        # Wait until the DB is healthy before the steps start.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # ------------------------------------------------------------------------
      # 1. Get the source code (third-party actions pinned to commit SHAs)
      # ------------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # ------------------------------------------------------------------------
      # 2. Language runtimes (Node.js 24 for Pocket48, Python 3.14 for deploy smoke tests)
      # ------------------------------------------------------------------------
      - name: Setup Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Setup Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      # ------------------------------------------------------------------------
      # 3. Deploy scripts: syntax check + offline tests (NO access to GCP)
      # ------------------------------------------------------------------------
      - name: Check deployment scripts without accessing GCP
        run: |
          bash -n deploy/deploy.sh deploy/teardown.sh deploy/release.sh
          bash deploy/tests/test_deploy_stub.sh
          bash deploy/tests/test_release_stub.sh
          python3 -m unittest discover -s deploy/tests -p 'test_smoke.py'

      # ------------------------------------------------------------------------
      # 4. Backend: install -> generate -> migrate -> seed -> Vitest -> tsc build
      # ------------------------------------------------------------------------
      - name: Install, Test & Build Backend (Prisma + Vitest + TypeScript)
        working-directory: ./server
        env:
          DATABASE_URL: postgresql://pocket48:pocket48@localhost:5432/pocket48?schema=public
          ADMIN_PASSWORD: ci-admin-initial-password
          DEMO_USER_PASSWORD: ci-demo-initial-password
          SESSION_SECRET: ci-pocket48-session-secret-at-least-32-chars
          TZ: Asia/Bangkok
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npm run prisma:seed
          npm test
          npm run build

      # ------------------------------------------------------------------------
      # 5. Frontend: install -> Vitest component tests -> Vite production build
      # ------------------------------------------------------------------------
      - name: Install, Test & Build Frontend (Vitest + Production Build)
        working-directory: ./client
        run: |
          npm ci
          npm test
          npm run build

      # ------------------------------------------------------------------------
      # 6. End-to-End Browser Journey Test (Playwright TEST-13 / AC-06-01)
      #    Re-seeds cleanly after backend integration tests, then starts server
      #    + Vite via playwright.config.ts webServer and runs Chromium E2E.
      # ------------------------------------------------------------------------
      - name: Run End-to-End Browser Test (Playwright TEST-13)
        working-directory: ./client
        env:
          DATABASE_URL: postgresql://pocket48:pocket48@localhost:5432/pocket48?schema=public
          PORT: "3000"
          TZ: Asia/Bangkok
          CORS_ORIGIN: http://localhost:5173
          SESSION_SECRET: ci-pocket48-session-secret-at-least-32-chars
          ADMIN_PASSWORD: ci-admin-initial-password
          DEMO_USER_PASSWORD: ci-demo-initial-password
          E2E_USER_EMAIL: user1@pocket48.local
        run: |
          npm run prisma:seed --prefix ../server
          npx playwright install --with-deps chromium
          npm run test:e2e

      # ------------------------------------------------------------------------
      # 7. Verify Unified Production Dockerfile builds cleanly (not pushed here)
      # ------------------------------------------------------------------------
      - name: Verify Unified Production Dockerfile Build
        run: |
          docker build -t pocket48:latest .

      # ------------------------------------------------------------------------
      # 8. Publish CI Check Summary (C-01 evidence)
      # ------------------------------------------------------------------------
      - name: Write CI summary
        run: |
          {
            echo '### pocKet48 CI & Docker Build (`test-and-docker`)'
            echo '- **Deploy script checks:** `bash -n`, `test_deploy_stub.sh`, `test_release_stub.sh`, `test_smoke.py` — passed'
            echo '- **Backend:** `prisma generate`, `prisma migrate deploy`, `prisma:seed`, `vitest run` (35 tests), `tsc` build — passed'
            echo '- **Frontend:** `vitest run` (11 tests), `tsc -b && vite build` — passed'
            echo '- **E2E (Playwright Chromium):** `TEST-13` Sprint 1 user journey (1 test) — passed'
            echo '- **Docker:** Unified multi-stage production image `docker build -t pocket48:latest .` — passed'
          } >> "$GITHUB_STEP_SUMMARY"
